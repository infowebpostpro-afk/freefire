<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Fire Gradients -->
    <linearGradient id="fire-grad-main" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A00"/>
      <stop offset="50%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    
    <linearGradient id="fire-grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE259"/>
      <stop offset="100%" stop-color="#FFA751"/>
    </linearGradient>
    
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2330"/>
      <stop offset="60%" stop-color="#141822"/>
      <stop offset="100%" stop-color="#0A0C10"/>
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="50%" stop-color="#FF3700"/>
      <stop offset="100%" stop-color="#801500"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="flame-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Ambient Glow Aura -->
  <path d="M50 4 L84 20 L76 66 L50 94 L24 66 L16 20 Z" fill="url(#fire-grad-main)" opacity="0.25" filter="url(#flame-glow)" />

  <!-- Shield Base Outer Border -->
  <path d="M50 6 L83 21 L75 65 L50 92 L25 65 L17 21 Z" fill="url(#border-grad)" stroke="#FFB800" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Shield Dark Inner Body -->
  <path d="M50 10 L79 23 L72 63 L50 88 L28 63 L21 23 Z" fill="url(#shield-grad)"/>

  <!-- Shield Tech Accents & Inner Facets -->
  <path d="M50 14 L75 25 L68 60 L50 82 L32 60 L25 25 Z" stroke="#FF4D00" stroke-width="1.2" stroke-opacity="0.4" fill="none"/>
  <line x1="50" y1="12" x2="50" y2="84" stroke="url(#fire-grad-main)" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Esports Roaring Flame Crown -->
  <!-- Left Wing Flame -->
  <path d="M28 42 C26 30 32 20 40 18 C37 24 38 29 42 32 C41 22 47 16 50 12 C53 16 59 22 58 32 C62 29 63 24 60 18 C68 20 74 30 72 42 C68 34 62 36 60 40 C63 45 61 52 50 56 C39 52 37 45 40 40 C38 36 32 34 28 42 Z" fill="url(#fire-grad-main)" filter="url(#flame-glow)"/>

  <!-- Center Golden Trident / Crown (FF 亗 Signature Symbol) -->
  <g transform="translate(0, 4)">
    <!-- Central Spear/Flame -->
    <path d="M50 26 L55 36 L52 46 L48 46 L45 36 Z" fill="url(#fire-grad-gold)"/>
    <!-- Left Blade -->
    <path d="M42 32 L46 38 L43 45 L38 41 Z" fill="url(#fire-grad-gold)"/>
    <!-- Right Blade -->
    <path d="M58 32 L62 41 L57 45 L54 38 Z" fill="url(#fire-grad-gold)"/>
    <!-- Crossbar Base -->
    <path d="M37 44 L63 44 L61 49 L39 49 Z" fill="url(#fire-grad-gold)"/>
    <!-- Center Core Emblem Point -->
    <polygon points="50,49 53,58 50,62 47,58" fill="#FFF"/>
  </g>

  <!-- Lower Tech Energy Chevron -->
  <polygon points="50,71 60,63 58,60 50,66 42,60 40,63" fill="url(#fire-grad-gold)"/>
  <polygon points="50,78 57,72 55,70 50,74 45,70 43,72" fill="url(#fire-grad-main)"/>
</svg>
